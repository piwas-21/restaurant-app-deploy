# Sofra tenant registry — sofra ADR-007 (committed YAML in the deploy repo is the
# source of truth until >3 tenants, then it graduates to a Postgres table).
#
# Consumed by provision-tenant.sh / deprovision-tenant.sh ON THE BOX (this file
# rsyncs there via sync-to-{box,staging}.yml). Scripts only READ this file —
# lifecycle changes (status flips, new tenants) are committed here in git first,
# then synced, then the script is run. No script ever edits the registry.
#
# Field notes:
#   managed:  legacy  = provisioned before S14 (RUMI prod) — scripts REFUSE to touch it (ADR-006:
#                       tenant 1 is registered, never migrated; its box/domain/secrets don't change)
#             scripts = stamped out by provision-tenant.sh
#   box:      prod (159.195.137.101) | staging (159.195.34.105) — must match BOX_ROLE in the box .env
#   domain_mode: subdomain ({slug}.sofrapiwas.com via the wildcard A record, added 2026-07-06)
#                | byo (tenant-owned domain, explicit DNS + Caddy block)  [ADR-002]
#   frontend_tag: per-tenant image tag — NEXT_PUBLIC_* are baked per domain; built by the frontend
#                 repo's build-tenant-image.yml workflow (convention: tenant-<slug>)
#   backend_tag:  backend image is domain-agnostic — tenants ride :latest unless pinned
#   currency / languages / modules: recorded per ADR-010; provisioning writes them into the
#                 tenant instance env. Still INERT at runtime — enforcement (route/endpoint
#                 gates) ships with S11 — but the VOCABULARY is now validated: modules must
#                 come from core | kitchen-board | cashier | server | reservations | loyalty |
#                 printing | extra-languages, or provision-tenant.sh fails loudly. Same list
#                 in the control plane (sofra lib/module-catalog.ts), which also carries the
#                 list price of each; the pricing sheet is the workspace repo's
#                 docs/plans/SOFRA-MODULE-CATALOG-AND-PRICING.md.
#   city:     optional free text — seeds RestaurantInfo.City on the tenant's first boot
#             (deploy#16 / backend #120, via RestaurantInfoSeed__City). `name` and
#             `admin_email` seed RestaurantInfo Name/Email the same way; the seeder is a
#             no-op after first boot, so later edits here only apply to re-created DBs.
#   template: optional UI template (frontend ADR-006 / S15 T2): classic | craft.
#             Absent = classic (the current RUMI look). Rendered into the tenant
#             .env as NEXT_PUBLIC_TEMPLATE; consumed at frontend image build —
#             INERT until the frontend T2 template-alias PR lands. Any other
#             value makes provision-tenant.sh fail loudly (no silent default).
#   live_since: optional go-live date, quoted "YYYY-MM-DD". Read ONLY by the sofra
#             control plane (tenant-registry.ts) to pre-fill the /admin/onboard
#             "Live since" field; provision-tenant.sh never reads it. Absent = the
#             admin enters the date manually. Quote it so YAML keeps it a string.
#   status:   provisioning -> active -> retired (descriptive; keep honest)

version: 1

tenants:
  rumi:
    name: RUMI Restaurant
    status: active
    managed: legacy
    box: prod
    domain: www.rumirestaurant.ch
    domain_mode: byo
    db: restaurantdb
    db_role: rumi
    compose_project: deploy
    backend_tag: latest
    frontend_tag: latest
    currency: CHF
    languages: [en, de, tr, it, ar, fr, nl, es, ru, zh]
    # Grandfathered: tenant 1 keeps every module (ADR-010 v1 scope).
    modules: [core, kitchen-board, cashier, server, reservations, loyalty, printing, extra-languages]
    # RUMI prod went live on the Netcup box on 2026-06-29 (ROADMAP).
    live_since: "2026-06-29"

  # Throwaway tenant used for the S14 provisioning-v1 DoD (stand up on staging,
  # order from it, tear down). Safe to re-provision any time for rehearsals.
  demo:
    name: Sofra Demo
    status: active
    managed: scripts
    box: staging
    domain: demo.sofrapiwas.com
    domain_mode: subdomain
    db: tenant_demo
    db_role: tenant_demo
    compose_project: tenant-demo
    # demo is a develop-TRACKING staging surface (like RUMI staging), NOT a prod
    # mirror — so its backend rides `:staging` (the develop build), never
    # `:latest` (= main/prod). DEPLOYMENT.md §"do not pin BACKEND_TAG=latest".
    # Keeps the demo backend on develop-tip so the frontend's runtime palette +
    # newest develop-only APIs round-trip.
    backend_tag: staging
    frontend_tag: tenant-demo
    currency: EUR
    languages: [en, nl]
    modules: [core]
    # craft = the sofra-mirror template (S15 T3 DoD): the demo tenant is the
    # showcase for template distinctness. Its tenant-demo image is baked with
    # NEXT_PUBLIC_TEMPLATE=craft.
    template: craft
    admin_email: mahmutkaya.nl@gmail.com
    city: Amsterdam
    # Staging-surface login throttle: demo's .env carries
    # TENANT_AUTH_PERMIT_LIMIT=20 (vs the backend's production 5 per 15 min per
    # IP). A showcase is meant to be poked at, and 5 fumbled logins locked the
    # single demo admin out for a quarter of an hour. Production tenants keep the
    # tight default — see the note in templates/docker-compose.tenant.yml.tpl.

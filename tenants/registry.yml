# Sofra tenant registry — sofra ADR-007 (committed YAML in the deploy repo is the
# source of truth until >3 tenants, then it graduates to a Postgres table).
#
# Consumed by provision-tenant.sh / deprovision-tenant.sh ON THE BOX (this file
# rsyncs there via sync-to-{box,staging}.yml). Scripts only READ this file —
# lifecycle changes (status flips, new tenants) are committed here in git first,
# then synced, then the script is run. No script ever edits the registry.
#
# Field notes:
#   managed:  legacy  = provisioned before S14 (RUMI prod) — scripts REFUSE to touch it (ADR-006:
#                       tenant 1 is registered, never migrated; its box/domain/secrets don't change)
#             scripts = stamped out by provision-tenant.sh
#   box:      prod (159.195.137.101) | staging (159.195.34.105) — must match BOX_ROLE in the box .env
#   domain_mode: subdomain ({slug}.{base_domain}, ours by default via the *.sofrapiwas.com
#                wildcard A record, added 2026-07-06)
#                | byo (tenant-owned domain, explicit DNS + Caddy block)  [ADR-002]
#                Absent = inferred from the domain. provision-tenant.sh cross-checks the two:
#                `subdomain` must be exactly {slug}.{base_domain}, `byo` must NOT be under
#                sofrapiwas.com — a mislabelled entry sends you chasing the wrong DNS record
#                while the tenant sits without a certificate. BYO needs an A record for the
#                domain pointing at the tenant's box before the cert can issue (S10).
#   base_domain: OPTIONAL. The zone this tenant's `subdomain` host lives under.
#                ABSENT = sofrapiwas.com, which is what every entry below means and what
#                every entry written before 2026-08-20 meant — omitting it is not a
#                shorthand, it IS the default, and provisioning is byte-for-byte the same.
#                Set it only for a RESELLER PARTNER's own zone, where the partner wants his
#                clients to live under his brand rather than ours
#                (SOFRA-PARTNER-FLEXIBILITY-PLAN §D1):
#
#                    obresse:
#                      domain: obresse.solutioneva.com
#                      domain_mode: subdomain
#                      base_domain: solutioneva.com
#
#                Three things to know before using it:
#                  * THERE IS NO WILDCARD on a partner's zone and there cannot be one we
#                    control — domainio resells ResellerClub's nameservers and cannot host a
#                    zone it holds no order for, so a delegated `clients.partner.com` subzone
#                    is impossible, not merely unbuilt (O-D1, answered 2026-08-20). The
#                    partner publishes ONE A record per client, `<slug>` -> the box IP,
#                    TTL >= 7200, BEFORE provisioning. A `*.partner.com` wildcard works too
#                    but takes over their whole company zone — permitted, discouraged, and
#                    never offered without that sentence.
#                  * The host must be exactly `{slug}.{base_domain}` — one label, matching
#                    the tenant key. provision-tenant.sh refuses anything else rather than
#                    guessing, for the same reason the `subdomain`/`byo` check exists.
#                  * It CONTRADICTS `domain_mode: byo` and provisioning refuses the pair:
#                    `byo` is a domain the RESTAURANT owns (no base to be under),
#                    `base_domain` is a zone we place tenants under. Silently honouring one
#                    would recreate the mislabelled-entry failure the cross-check prevents.
#                Changing a LIVE tenant's domain is not a registry edit: NEXT_PUBLIC_* are
#                baked per domain, so it is a frontend image rebuild plus a re-provision.
#   domain_aliases: optional list of extra hostnames — typically the `www.` of a BYO apex.
#                They get their own Caddy block that 301s to `domain`, never a second proxy:
#                the frontend bundle bakes NEXT_PUBLIC_* for ONE origin, so serving the app
#                on a second hostname means cross-origin API calls. Each alias needs its own
#                A record too.
#   frontend_tag: per-tenant image tag — NEXT_PUBLIC_* are baked per domain; built by the frontend
#                 repo's build-tenant-image.yml workflow (convention: tenant-<slug>)
#   backend_tag:  backend image is domain-agnostic — tenants ride :latest unless pinned.
#                 :latest = released code (published only from main) and is what the sofra
#                 control plane emits for EVERY generated entry; :staging = the develop
#                 build, for a SHOWCASE only, written in by hand at the review checkpoint.
#                 The difference is not just "newer code": the staging box re-pulls and
#                 recreates :staging tenants on every backend develop merge, which applies
#                 develop's EF migrations to that tenant's database — not reversible by
#                 re-pointing the image. A moving tag only tracks on the STAGING box; see
#                 DEPLOYMENT.md §"Tenants on moving tags".
#   currency / languages / modules: recorded per ADR-010; provisioning writes them into the
#                 tenant instance env. The VOCABULARY is validated: modules must come from
#                 core | kitchen-board | cashier | server | reservations | loyalty |
#                 printing | online-payments | extra-languages, or provision-tenant.sh fails
#                 loudly. Same list
#                 in the control plane (sofra lib/module-catalog.ts), which also carries the
#                 list price of each; the pricing sheet is the workspace repo's
#                 docs/plans/SOFRA-MODULE-CATALOG-AND-PRICING.md.
#
#                 `modules` is ENFORCED AT RUNTIME since backend #268 (S11), and since
#                 2026-08-01 a tenant provisioned for the FIRST time enforces by default —
#                 tenant.env.tpl renders TENANT_MODULES_ENFORCE=true, so this list is what
#                 the customer actually gets. It remains an operator control on the box
#                 (provision-tenant.sh only validates it, never rewrites it), so a tenant
#                 deliberately un-enforced stays that way. A tenant provisioned BEFORE that
#                 date serves every module regardless of this list until someone flips it.
#   stripe_account: OPTIONAL `acct_...`, required only when `modules` includes
#                 `online-payments` — provisioning refuses that combination without it, because
#                 a tenant who bought payments but has no account would fail at the diner's
#                 first card, which is the worst place to find out. Recorded AFTER the
#                 restaurant completes Stripe's hosted onboarding (it cannot be pre-filled:
#                 the platform cannot write KYC to a Standard account). See the runbook.
#
#                 GRANTING it later (the self-serve buyer's second registry PR) means adding
#                 `stripe_account:` AND putting `online-payments` back into `modules` in the SAME
#                 commit — the control plane withholds the module when it has no account, so the
#                 pair arrives together or not at all. Then RE-PROVISION that tenant (which
#                 recreates its containers — a bare `docker compose restart` re-reads nothing,
#                 measured 2026-08-18); the lever that proves it is the tenant's own
#                 `GET /api/payments/availability`, which answers 404 ModuleNotEnabled before
#                 and {"available": true} after. Rehearsed end to end on 2026-08-18.
#                 Runbook §2b.5.
#
#                 Two consequences worth knowing before editing a list:
#                   - Editing `modules` here changes nothing until you re-provision that
#                     tenant (the recreate is the part that applies it). There is no image rebuild — the set is
#                     served from the backend (GET /api/tenant/modules) rather than baked
#                     into the frontend image, so an upsell is not a rebuild. The frontend
#                     consumes that endpoint too (route + nav gating, frontend #348), so a
#                     flip gates the UI as well as the API — but the UI reads it through a
#                     30s per-path ISR cache, so give it a second request before believing
#                     a stale nav. Both halves proven on `demo` 2026-07-29.
#                   - RUMI (managed: legacy) runs the MAIN compose project, so its list below
#                     never reaches its container and never will. It is documentation of what
#                     tenant 1 has, not a control. Do not try to make it one.
#   city:     optional free text — seeds RestaurantInfo.City on the tenant's first boot
#             (deploy#16 / backend #120, via RestaurantInfoSeed__City). `name` and
#             `admin_email` seed RestaurantInfo Name/Email the same way; the seeder is a
#             no-op after first boot, so later edits here only apply to re-created DBs.
#   template: optional UI template (frontend ADR-006 / S15 T2): classic | craft.
#             Absent = classic (the current RUMI look). Rendered into the tenant
#             .env as NEXT_PUBLIC_TEMPLATE; consumed at frontend image build —
#             INERT until the frontend T2 template-alias PR lands. Any other
#             value makes provision-tenant.sh fail loudly (no silent default).
#   pwa_theme_color / pwa_background_color: OPTIONAL, quoted "#rrggbb" (upper or lower case).
#             The installed-app palette: `theme_color` is the browser/OS chrome around the
#             app on a phone home screen, `background_color` the splash while it boots
#             (frontend src/app/manifest.ts). Forwarded by provision-on-registry-merge.yml
#             to build-tenant-image.yml as `pwa_theme_color` / `pwa_background_color`.
#             ⚠️ ABSENT DEFAULTS TO **RUMI RED #c00000** AND WHITE — the classic template's
#             palette (frontend src/lib/config.ts). That default is not neutral: a tenant
#             whose brand is not red and who leaves these unset ships another restaurant's
#             red around their own app. Set BOTH for any tenant with its own palette.
#             Absent is still the byte-identical no-op it always was, which is why RUMI and
#             `demo` carry neither: an empty value forwards nothing and the frontend keeps
#             its own default. Quote the value so YAML does not read `#...` as a comment.
#             A malformed value is REFUSED by the provisioning chain before it spends ~20
#             minutes building an image (and again by the frontend workflow).
#             These are BAKED at frontend build time, so changing them on a LIVE tenant is
#             an image rebuild plus a re-provision, exactly like `domain` and `template` —
#             not a registry edit that takes effect on its own.
#             The ICONS are a separate mechanism and are NOT registry fields: they are the
#             six files in the branding archive/dir passed to build-tenant-image.yml, and
#             since frontend #644 an archive carrying icon.svg without all three manifest
#             PNGs FAILS the build rather than mixing a tenant's favicon with the platform
#             icon on their customers' phones.
#   live_since: optional go-live date, quoted "YYYY-MM-DD". Read ONLY by the sofra
#             control plane (tenant-registry.ts) to pre-fill the /admin/onboard
#             "Live since" field; provision-tenant.sh never reads it. Absent = the
#             admin enters the date manually. Quote it so YAML keeps it a string.
#   mail_from: OPTIONAL bare address the tenant's mail is sent FROM, e.g. info@kebabhouse.ch.
#             Absent = the default and the normal case: <slug>@$PLATFORM_MAIL_DOMAIN (the box's
#             shared, Resend-verified platform domain). The display name is ALWAYS the
#             restaurant's `name`, so the guest reads "Kebab House" either way — this field
#             only decides the envelope domain, i.e. whose deliverability reputation is at
#             stake. Set it only once that domain is VERIFIED in Resend; an unverified
#             domain does not degrade, it 403s every send.
#             Bare address only — no display name, no angle brackets (provisioning
#             shape-checks it), and never rumirestaurant.ch for any tenant but `rumi`:
#             tenant 1's verified domain is its identity, and sharing it puts tenant 1's
#             deliverability behind a stranger's spam complaints.
#             ⚠️ Changing this on an ALREADY-provisioned tenant does not take effect by
#             re-running provisioning — app-secrets.json is kept so JWT/printer secrets
#             survive. The script detects the mismatch and prints the exact hand-fix.
#   partner_name / partner_url / partner_attribution: OPTIONAL. The reseller partner who
#             built this site, credited as "Site by <name>" (linked) in the tenant FOOTER
#             (SOFRA-PARTNER-PLAN §11d). Flat keys, never a nested `partner:` map:
#             provision-tenant.sh reads the entry with a fixed key list and flattens every
#             value with `str(v)`, so a nested map would arrive in the shell as a
#             stringified Python dict.
#
#                 obresse:
#                   partner_name: Solution Eva
#                   partner_url: https://solutioneva.com
#                   partner_attribution: true      # optional; ABSENT MEANS TRUE
#
#             ABSENT `partner_attribution` = TRUE, and it is only ever consulted when
#             `partner_name` is set. It is the RESTAURANT's off-switch, not the partner's:
#             the partner's own publish flag lives in the control plane and covers all of
#             their clients at once, so this is the one place a single restaurant that does
#             not want a reseller's name on its page can say so. Write it out only to turn
#             the credit OFF.
#             ⚠️ It must be a YAML boolean — exactly `true` or `false`. `yes`/`on`/`1` are
#             REFUSED loudly, the same way TENANT_MODULES_ENFORCE refuses them, because the
#             failure of a guessed value here is silent: the credit stays up on a page whose
#             owner asked for it to come down. `partner_attribution` with no `partner_name`
#             is a contradiction and is refused too — the switch would be switching nothing.
#             `partner_url` must be `https://` plus a bare host (no path, no port, no
#             http://): it becomes an href on the restaurant's PUBLIC page.
#             Attribution OFF renders the tenant .env's TENANT_PARTNER_NAME/URL EMPTY —
#             identical to a tenant with no partner — so turning it off REMOVES the credit
#             rather than merely not adding it. The boolean is resolved by
#             provision-tenant.sh and never reaches the tenant, which therefore carries one
#             meaning only: what to display.
#             Editing any of the three changes nothing until you RE-PROVISION that tenant
#             (the container recreate is the part that applies it), exactly as `modules`
#             above. No image rebuild: the footer reads it from the backend at runtime.
#   frontend_refresh_blocked: OPTIONAL free-text reason. PRESENCE acknowledges that this
#             tenant CANNOT currently be refreshed by the frontend release chain
#             (frontend repo release-tenant-images.yml -> list-release-tenants.sh), which
#             downgrades its refusal from a failed run to a loud, listed warning. The
#             VALUE is the reason and what unblocks it — there is no boolean, because an
#             entry that cannot say why it is blocked is not acknowledged, it is ignored.
#             DELETE THE KEY to re-arm the alarm; forgetting to delete it is the only way
#             to stay quiet, which is the right direction for that mistake to point.
#             Only reason it exists: an alarm that is red for weeks because a third party
#             has not acted stops being an alarm. See obresse below, the case it was
#             written for.
#   status:   provisioning -> active -> retired (descriptive; keep honest)
#
#   ── Which tenants a FRONTEND release reaches (2026-08-30) ─────────────────────────
#   A frontend tenant image is NOT re-pullable: NEXT_PUBLIC_* are baked at BUILD time, so
#   every tenant needs its own rebuild of the released source. Until 2026-08-30 nothing
#   did that after provisioning, and two real reseller tenants sat a release and eleven
#   days behind while their registry entries were perfectly correct. `list-release-tenants.sh`
#   now derives the set from THIS FILE on every frontend release to main; a tenant is
#   included when it is `managed: scripts`, `status: active` and `backend_tag: latest`
#   (riding released backend = wanting released code; a develop showcase like `demo` is
#   rebuilt by the frontend's build-demo-tenant.yml instead).
#
#   AND ITS `domain` MUST RESOLVE. A refresh re-BAKES that hostname as the bundle's
#   origin, so it is not a safe no-op: pointing it at a name that does not exist replaces
#   a working tenant with a dead one. An unresolvable domain refuses the tenant loudly.

version: 1

tenants:
  rumi:
    name: RUMI Restaurant
    status: active
    managed: legacy
    box: prod
    domain: www.rumirestaurant.ch
    domain_mode: byo
    db: restaurantdb
    db_role: rumi
    compose_project: deploy
    backend_tag: latest
    frontend_tag: latest
    currency: CHF
    languages: [en, de, tr, it, ar, fr, nl, es, ru, zh]
    # Grandfathered: tenant 1 keeps every module (ADR-010 v1 scope).
    modules: [core, kitchen-board, cashier, server, reservations, loyalty, printing, extra-languages]
    # RUMI prod went live on the Netcup box on 2026-06-29 (ROADMAP).
    live_since: "2026-06-29"

  # Throwaway tenant used for the S14 provisioning-v1 DoD (stand up on staging,
  # order from it, tear down). Safe to re-provision any time for rehearsals.
  demo:
    name: Sofra Demo
    status: active
    managed: scripts
    box: staging
    domain: demo.sofrapiwas.com
    domain_mode: subdomain
    db: tenant_demo
    db_role: tenant_demo
    compose_project: tenant-demo
    # demo is a develop-TRACKING showcase, NOT a customer — so its backend rides
    # `:staging` (the develop build) rather than the `:latest` every generated entry
    # gets. Keeps the demo backend on develop-tip so the frontend's runtime palette +
    # newest develop-only APIs round-trip. This is the ONE tenant for which that trade
    # is right: it has no paying owner, so develop's migrations landing in its database
    # on every merge costs nothing. provision-tenant.sh prints a NOTE saying as much.
    # (Do not read DEPLOYMENT.md §"do not pin BACKEND_TAG=latest" as support for this —
    # that rule is about the RUMI staging STACK's own .env, not a tenant registry entry.)
    backend_tag: staging
    frontend_tag: tenant-demo
    currency: EUR
    languages: [en, nl]
    # The full-service bundle, because that is what the demo actually SHOWS: kitchen
    # board, cashier, server, reservations and loyalty are all reachable on it today.
    # ENFORCED: demo was the FIRST tenant flipped, by hand, back when enforcement was
    # opt-in (its .env on the staging box). Every tenant provisioned since 2026-08-01
    # is born enforcing, so demo is no longer the exception — but it is still the only
    # one whose flag was set by an operator rather than by the template.
    # So this list is binding here: dropping an id takes that surface off
    # the demo, and `printing` is absent deliberately, as the standing proof that a
    # module nobody bought 404s. Edit this list only via re-provision + backend restart.
    modules: [core, kitchen-board, cashier, server, reservations, loyalty]
    # craft = the sofra-mirror template (S15 T3 DoD): the demo tenant is the
    # showcase for template distinctness. Its tenant-demo image is baked with
    # NEXT_PUBLIC_TEMPLATE=craft.
    template: craft
    admin_email: mahmutkaya.nl@gmail.com
    city: Amsterdam
    # Staging-surface login throttle: demo's .env carries
    # TENANT_AUTH_PERMIT_LIMIT=20 (vs the backend's production 5 per 15 min per
    # IP). A showcase is meant to be poked at, and 5 fumbled logins locked the
    # single demo admin out for a quarter of an hour. Production tenants keep the
    # tight default — see the note in templates/docker-compose.tenant.yml.tpl.

  # PERMANENT TEST FIXTURE — the provisioning smoke suite's tenant
  # (.github/workflows/provisioning-smoke.yml). Nothing runs here between smoke
  # runs: the suite stands this tenant up, checks it, and destroys it again.
  #
  # `status: retired` is load-bearing twice over:
  #   * the merge chain selects on `status: provisioning`, so it will never pick
  #     this entry up — a registry merge cannot accidentally stand up the fixture;
  #   * `checkSlug` counts EVERY registry slug as taken regardless of status, so
  #     the name is still reserved against a customer signing up as `smoke` and
  #     colliding with a run.
  #
  # Do NOT flip this to `provisioning`. That hands the entry to the chain, which
  # would provision it on the next registry merge and leave it running.
  smoke:
    name: Provisioning Smoke
    status: retired
    managed: scripts
    box: staging
    domain: smoke.sofrapiwas.com
    domain_mode: subdomain
    db: tenant_smoke
    db_role: tenant_smoke
    compose_project: tenant-smoke
    # `staging` = the develop build, like demo: this box tracks develop, and the
    # point of the suite is to catch a break before it reaches a real tenant.
    backend_tag: staging
    frontend_tag: tenant-smoke
    currency: EUR
    languages: [en]
    modules: [core]
    template: classic
    admin_email: mahmutkaya.nl+smoke@gmail.com
    city: Amsterdam

  # Reseller tenant — partner Mustafa Vural (Solution Eva). RETIRED 2026-08-31:
  # the restaurant is not going live on the platform (the move to his own zone was
  # never even applied — see the git history of this block for the 2026-08-30
  # stale-but-working standoff). Torn down the same day via
  # deprovision-tenant.sh obresse --drop-db --purge, which archived DB + uploads
  # into /opt/rumi/backups/archive on the 24-month clock first (executed 2026-08-31
  # via the sync workflow's [teardown:] path). The entry stays
  # (retired, like `smoke`) to keep the record honest and reserve the slug;
  # the frontend_refresh_blocked key died with the retirement — a retired tenant
  # is owed nothing by any release chain.
  obresse:
    name: O'Bresse
    status: retired
    managed: scripts
    box: staging
    # Moved onto the PARTNER's own zone 2026-08-21 at his request (§D1 — the first
    # real use of base_domain). His zone has NO wildcard, so obresse.solutioneva.com
    # lives or dies by ONE A record -> the staging box, published by him.
    domain: obresse.solutioneva.com
    domain_mode: subdomain
    base_domain: solutioneva.com
    # The old home, kept as a 301 alias rather than dropped: the tables' printed QR
    # codes and every link handed out so far point at it, and a moved restaurant
    # whose QR codes 404 is worse than one that never moved. Rides our wildcard, so
    # it needs no record of its own.
    domain_aliases: [obresse.sofrapiwas.com]
    db: tenant_obresse
    db_role: tenant_obresse
    compose_project: tenant-obresse
    backend_tag: latest
    frontend_tag: tenant-obresse
    currency: EUR
    languages: [fr, en]
    modules: [core, kitchen-board, cashier, server, reservations, loyalty, printing, extra-languages]
    # classic, not craft: the partner reported craft looking broken on his client's
    # content 2026-08-21. Switched on his say-so — the craft defects themselves are
    # NOT diagnosed by this change and stay open (demo still ships craft).
    template: classic
    admin_email: obresse@solutioneva.com
    city: Montréal-la-Cluse

  # Reseller tenant #2 — partner Mustafa Vural (Solution Eva). Kebab d'Ilhan,
  # a kebab/tacos snack in Cluses (FR), trading since 2000. Full-service bundle
  # + extra-languages; `online-payments` deliberately absent (needs the restaurant's
  # own Stripe connected account + KYC first — runbook §2b/§2b.5).
  kebabdilhan:
    name: Kebab d'Ilhan
    status: active
    managed: scripts
    box: staging
    # OUR zone, not the partner's: this one rides the *.sofrapiwas.com wildcard,
    # so it needs no DNS record of its own (contrast obresse, on solutioneva.com).
    domain: kebabdilhan.sofrapiwas.com
    domain_mode: subdomain
    db: tenant_kebabdilhan
    db_role: tenant_kebabdilhan
    compose_project: tenant-kebabdilhan
    backend_tag: latest
    frontend_tag: tenant-kebabdilhan
    currency: EUR
    languages: [fr, en]
    modules: [core, kitchen-board, cashier, server, reservations, loyalty, printing, extra-languages]
    # classic on the partner's standing preference — he reported craft looking
    # broken on his client content 2026-08-21 and obresse was switched for it.
    template: classic
    admin_email: kebabdilhan@solutioneva.com
    city: Cluses

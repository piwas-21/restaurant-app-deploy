name: sync-to-staging

# Push the deploy artifacts to the STAGING box. Mirrors sync-to-box.yml but targets
# the staging host secrets and the shared infra files (compose, Caddyfiles, scripts).
# The staging box selects Caddyfile.staging via CADDYFILE in its own .env.
#
# Triggers on push to main (like sync-to-box.yml) so the staging box tracks infra
# changes automatically, plus workflow_dispatch for manual re-syncs. Enabled once the
# STAGING_* secrets were set and the box was provisioned (2026-07-03).
#
# Secrets (set in the deploy repo): STAGING_HOST, STAGING_USER, STAGING_SSH_KEY
# (matches a key in rumi@staging:~/.ssh/authorized_keys), STAGING_KNOWN_HOSTS
# (staging box host keys — pin against MITM; get via `ssh-keyscan 159.195.34.105`).
#
# Note: this copies files only; it does not restart the stack. Apply with
# `./deploy.sh` (or a caddy force-recreate) on the box afterwards.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DEPLOYMENT.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: rsync deploy files to staging box
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure SSH (pinned host key)
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to /opt/rumi/deploy
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        # No --delete, deliberately and permanently. The destination is NOT a mirror of
        # this repo: provision-tenant.sh writes `caddy-tenants/<slug>.caddy` INSIDE
        # /opt/rumi/deploy for every live tenant (provision-tenant.sh:675, removed again by
        # deprovision-tenant.sh:59), and those files exist nowhere in git. `--delete` would
        # remove every live tenant's Caddy site block on the next push to main — every tenant
        # site off the internet until someone re-provisioned. Protected runtime files
        # (.env, app-secrets.json, dozzle-users.yml) and CI/local-only paths are excluded
        # outright; the drift that a missing --delete leaves behind is REPORTED by the next
        # step instead of being repaired destructively.
        run: |
          rsync -az --human-readable --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.ssh/' \
            --exclude='.env' \
            --exclude='app-secrets.json' \
            --exclude='dozzle-users.yml' \
            --exclude='*.bak' \
            --exclude='*.bak.*' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ "${STAGING_USER}@${STAGING_HOST}:/opt/rumi/deploy/"

      # The cost of not using --delete is that a file deleted from this repo lives on the
      # box forever, silently. This makes that visible without touching anything: a DRY-RUN
      # --delete whose output is printed, never executed. Runtime-owned paths are excluded
      # from the report too, so what remains is genuinely a leftover rather than the normal
      # working state of a provisioned box.
      - name: Report on-box files this repo no longer has (never deletes)
        continue-on-error: true
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -uo pipefail
          echo "Files present on the box but not in this repo (report only — nothing is deleted):"
          rsync -az --dry-run --delete --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.ssh/' \
            --exclude='.env' \
            --exclude='app-secrets.json' \
            --exclude='dozzle-users.yml' \
            --exclude='*.bak' \
            --exclude='*.bak.*' \
            --exclude='caddy-tenants/*.caddy' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ "${STAGING_USER}@${STAGING_HOST}:/opt/rumi/deploy/" \
            | grep '^\*deleting' || echo "  (none — the box matches the repo)"

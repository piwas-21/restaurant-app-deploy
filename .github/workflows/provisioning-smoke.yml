name: provisioning-smoke

run-name: provisioning-smoke ${{ github.event_name }}

# Stands a real tenant up from nothing, checks it over the public internet, and
# destroys it again. Unmocked end to end: a real tenant image build, the real
# provision-tenant.sh on the real box, a real database, a real Let's Encrypt cert.
#
# WHY this exists. Everything downstream of a registry merge is box wiring, and box
# wiring is the part CI structurally cannot reach: the Caddy site block, the compose
# template render, secret generation, registry->env injection, TLS issuance for a host
# that has never existed, the tenant frontend image being usable at all, and the
# backend booting + migrating + seeding against a GENUINELY EMPTY database. Until the
# 2026-07-30 chain run none of that had ever executed outside a local rehearsal, and it
# only executes when a real customer is onboarded — which is the worst possible moment
# to discover it broke.
#
# WHAT IT DOES NOT COVER, deliberately: the merge trigger. The chain fires on a registry
# commit, commits to `develop` need a PR, and the `main-develop` ruleset has no bypass —
# correctly, because ADR-012 invariant 3 makes that merge the human review checkpoint.
# Automating it would mean handing this workflow a token that can bypass branch
# protection, which is a far worse trade than leaving one link to real onboardings. So
# this covers everything AFTER the merge, and says so rather than implying full coverage.
#
# COST: nothing. The tenant lives ~5 minutes on a box that is already paid for; the cost
# plan puts a marginal tenant at EUR 0/mo and flat until ~tenant 10. No Mollie, no billing
# row — the payment gate governs self-serve PROPOSALS, and this slug has no plan at all.
#
# SAFETY, in order of how badly each would go wrong:
#   1. The slug is HARD-CODED. There is no input, so there is no untrusted-slug class and
#      no way to point this at a real tenant.
#   2. It refuses to run unless the on-box registry entry still says `status: retired`.
#      If someone flips it to `provisioning` the chain owns the slug, and two things
#      provisioning the same tenant is how you get a half-built one.
#   3. Teardown is `if: always()`. A failed check must not leave a tenant running, and
#      `--purge` is what makes the slug re-runnable next week.
#   4. Concurrency group is SHARED with provision-tenant.yml and the chain, so this can
#      never touch the box's Caddy/compose while a real provision is in flight. It is held
#      by the `smoke` JOB only — the image build deliberately runs outside it, because
#      holding a lock a real customer needs while waiting on a build in another repo is
#      not safety, it is a queue.

on:
  schedule:
    # Mondays 04:17 UTC. Off the hour on purpose — GitHub's scheduler queues heavily
    # at :00 and a delayed run makes the "how long did provisioning take" number lie.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

# NOTE: the shared `provision-tenant` concurrency group is declared on the `smoke` JOB,
# not here. Workflow-level concurrency holds the lock for the whole run, and this run
# spends its first ~3.5 minutes waiting on an image build in another repo — during which
# a real customer's provision would have been queued behind a fixture. The lock is now
# taken only for the part that actually touches the box.

# NOTE: permissions are declared per JOB below, never at workflow level (Sonar
# githubactions:S8264). The distinction this file has always made is now enforced by
# scope rather than by comment: `issues: write` is granted ONLY to the `report` job —
# the one job that never touches the box. No reason for the SSH-bearing jobs to be able
# to write to the tracker.

env:
  SLUG: smoke
  DOMAIN: smoke.sofrapiwas.com
  IMAGE_TAG: tenant-smoke
  TENANT_NAME: Provisioning Smoke
  TEMPLATE: classic
  CURRENCY: EUR
  # Must equal the fixture's `modules:` in tenants/registry.yml. Kept here rather than
  # inline in the assertion so widening the fixture is one edit in two obvious places,
  # not a red smoke blaming enforcement for a registry change.
  MODULES: core
  # Must equal the fixture's `languages:` in tenants/registry.yml, for the same reason
  # MODULES does — and it is asserted against the container env rather than an endpoint,
  # because nothing serves this one over HTTP (GAP-2 S9).
  LANGUAGES: en
  EXPECTED_STATUS: retired
  FRONTEND_REPO: piwas-21/restaurant-app-frontend
  FRONTEND_REF: main
  BUILD_WAIT_SECS: "1200"

jobs:
  # Builds the tenant image, and holds NO lock while doing it. Two changes in one job:
  #
  # 1. It is a separate job so the shared `provision-tenant` concurrency group (now on
  #    the `smoke` job below) is not held for the 172-212s this takes. Measured over four
  #    runs, the build was 76% of the whole smoke; the thing actually under test —
  #    provision, verify over the internet, destroy, confirm — is 44-51s. On a Monday
  #    morning when a real customer's registry PR merges, the fixture used to sit in front
  #    of it for ~4 minutes.
  #
  # 2. It usually does not build at all. The image tag (`tenant-smoke`) and the frontend
  #    ref (`main`) are both fixed, so if `main` has not moved since the last smoke, the
  #    rebuild produces an equivalent image. The last-built SHA is remembered in the
  #    Actions cache.
  #
  # What this gives up: re-proving weekly that the tenant image BUILDS. That is not lost —
  # the frontend repo's own CI builds on every change to `main` — but a break that only the
  # tenant-arg path exposes would surface on the next frontend change rather than next
  # Monday. Hence the forced rebuild in the first week of each month, which puts a floor
  # under how stale that proof can get.
  image:
    name: build the tenant image (only when the frontend moved)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Decide whether the tenant image needs rebuilding
        id: decide
        env:
          FRONTEND_DISPATCH_TOKEN: ${{ secrets.FRONTEND_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(GH_TOKEN="$FRONTEND_DISPATCH_TOKEN" gh api \
                  "repos/${FRONTEND_REPO}/commits/${FRONTEND_REF}" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${FRONTEND_REPO}@${FRONTEND_REF} is at $sha"

          # First week of the month: rebuild regardless, so "the tenant image still
          # builds" is re-proved at least monthly even if the frontend is quiet.
          # %-d, not %d: `[ 08 -le 7 ]` is an octal-parse error in bash, and the failure
          # would land on exactly two days of the month.
          day="$(date -u +%-d)"
          if [ "$day" -le 7 ]; then
            echo "monthly forced rebuild (day ${day} of the month)"
            echo "forced=true" >> "$GITHUB_OUTPUT"
          else
            echo "forced=false" >> "$GITHUB_OUTPUT"
          fi

      # A marker keyed on the SHA. A hit means the last smoke already built this exact
      # frontend commit into the `tenant-smoke` tag. A miss is the safe direction: build.
      # (Cache entries expire after 7 days unused; a weekly schedule keeps this one warm,
      # and an expiry costs one extra build, never a wrong one.)
      - name: Look up the last built frontend SHA
        id: marker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .smoke-image-marker
          key: tenant-smoke-image-${{ steps.decide.outputs.sha }}

      - name: Build the tenant image
        id: build
        if: ${{ steps.marker.outputs.cache-hit != 'true' || steps.decide.outputs.forced == 'true' }}
        env:
          FRONTEND_DISPATCH_TOKEN: ${{ secrets.FRONTEND_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # A minute of slack: the runs list is eventually consistent, and clock skew that
          # put `since` in the future would never match the run we just made.
          since="$(python3 -c 'import datetime as d; print((d.datetime.now(d.timezone.utc) - d.timedelta(minutes=1)).strftime("%Y-%m-%dT%H:%M:%SZ"))')"

          GH_TOKEN="$FRONTEND_DISPATCH_TOKEN" gh workflow run build-tenant-image.yml \
            --repo "$FRONTEND_REPO" --ref "$FRONTEND_REF" \
            -f tenant_domain="$DOMAIN" \
            -f image_tag="$IMAGE_TAG" \
            -f restaurant_name="$TENANT_NAME" \
            -f template="$TEMPLATE" \
            -f currency="$CURRENCY"

          # Match on `run-name`, which build-tenant-image sets to
          # "build-tenant-image <image_tag>". That seam reached main with frontend #350,
          # so unlike the merge chain — which still carries a time-matching fallback for
          # refs that predate it — this can REQUIRE the name and fail loudly without it.
          # A fallback that silently picks "some recent run" is how you verify the wrong
          # build.
          deadline=$(( $(date +%s) + BUILD_WAIT_SECS ))
          run_id=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            run_id="$(GH_TOKEN="$FRONTEND_DISPATCH_TOKEN" gh run list \
              --repo "$FRONTEND_REPO" --workflow build-tenant-image.yml \
              --created ">=${since}" --limit 20 \
              --json databaseId,displayTitle,status,conclusion \
              --jq "[.[] | select(.displayTitle == \"build-tenant-image ${IMAGE_TAG}\")] | .[0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::no build-tenant-image run named 'build-tenant-image ${IMAGE_TAG}' appeared within ${BUILD_WAIT_SECS}s."
            echo "::error::If the frontend's run-name has changed, fix the match rather than adding a fallback."
            exit 1
          fi
          echo "watching frontend run $run_id"
          GH_TOKEN="$FRONTEND_DISPATCH_TOKEN" gh run watch "$run_id" --repo "$FRONTEND_REPO" --exit-status

      - name: Skipped the rebuild
        if: ${{ steps.build.outcome == 'skipped' }}
        run: |
          echo "::notice::${FRONTEND_REPO}@${FRONTEND_REF} is unchanged (${{ steps.decide.outputs.sha }}) — reusing the existing ${IMAGE_TAG} image."

      # Written only after a build that actually succeeded, so a failed build cannot make
      # the next run believe the image is current.
      - name: Remember the built frontend SHA
        if: ${{ steps.build.outcome == 'success' }}
        run: echo "${{ steps.decide.outputs.sha }}" > .smoke-image-marker

      # Not when the marker was already a hit (a forced monthly rebuild of an unchanged
      # SHA): re-saving an existing key is a no-op that logs a scary warning.
      - name: Save the marker
        if: ${{ steps.build.outcome == 'success' && steps.marker.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .smoke-image-marker
          key: tenant-smoke-image-${{ steps.decide.outputs.sha }}

  smoke:
    name: provision, verify, destroy
    needs: image
    runs-on: ubuntu-latest
    # Deliberately NOT granted `issues: write`: this is the SSH-bearing job.
    permissions:
      contents: read
    timeout-minutes: 40
    # SHARED with provision-tenant.yml and provision-on-registry-merge.yml: all three run
    # provision-tenant.sh against the same box, and it touches shared Caddy + compose.
    # Declared on the job rather than the workflow so the image build above does not hold
    # it — see the note at the top of this file.
    concurrency:
      group: provision-tenant
      cancel-in-progress: false
    steps:
      - name: Configure SSH (pinned host key)
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Refuse if the fixture is not inert
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          ssh_box() {
            ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 "${STAGING_USER}@${STAGING_HOST}" "$@"
          }
          # Read the status off the BOX's registry, not this checkout: the box's copy is
          # the one provision-tenant.sh reads, and it is the one the chain would have
          # acted on. Asking the repo would answer a different question.
          #
          # Fetched, then parsed HERE rather than parsed over SSH. A python snippet
          # nested inside a remote command string is three layers of quoting deep, and
          # its failure mode is a mangled script that prints nothing — which this guard
          # would read as a status mismatch and report as entirely the wrong problem.
          ssh_box "cat /opt/rumi/deploy/tenants/registry.yml" > /tmp/box-registry.yml
          status="$(python3 -c 'import os,yaml; r=yaml.safe_load(open("/tmp/box-registry.yml")) or {}; t=(r.get("tenants") or {}).get(os.environ["SLUG"]); print(t.get("status","NO-STATUS") if t else "MISSING")')"
          echo "on-box status for '${SLUG}': ${status}"
          if [ "$status" != "$EXPECTED_STATUS" ]; then
            echo "::error::registry entry '${SLUG}' has status '${status}', expected '${EXPECTED_STATUS}'."
            echo "::error::Refusing to run. 'provisioning' means the merge chain owns this slug and may be mid-flight;"
            echo "::error::anything else means the fixture was repurposed. Neither is safe to stand up from here."
            exit 1
          fi
          # Nothing may be left over from a previous run — a surviving marker or tenant
          # dir means the last teardown did not finish, and provisioning on top of it
          # would test a re-provision rather than a first provision.
          leftovers="$(ssh_box "ls -d /opt/rumi/tenants/${SLUG} 2>/dev/null || true")"
          if [ -n "$leftovers" ]; then
            echo "::error::/opt/rumi/tenants/${SLUG} still exists — a previous run did not tear down."
            echo "::error::Clear it with: ./deprovision-tenant.sh ${SLUG} --drop-db --purge"
            exit 1
          fi

      - name: Provision on the box
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "${STAGING_USER}@${STAGING_HOST}" \
            "cd /opt/rumi/deploy && ./provision-tenant.sh '${SLUG}'"

      - name: Verify the tenant over the public internet
        run: |
          set -euo pipefail
          fail=0
          note() { echo "::error::$1"; fail=1; }

          # Give Caddy a moment to finish its first-hit certificate order. A tight loop
          # here rather than a flat sleep, so a fast issue does not cost 30s every week.
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${DOMAIN}/api/health" || true)"
            [ "$code" = "200" ] && break
            sleep 5
          done

          # 1. It serves, on its own certificate.
          for path in / /menu /auth/login /forgot-password /api/health; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${DOMAIN}${path}" || true)"
            echo "  ${path} -> ${code}"
            [ "$code" = "200" ] || note "${path} returned ${code}, expected 200"
          done

          # Responses are fetched to a FILE and parsed from it, never piped into an
          # interpreter. Two reasons, and only the second one is about Sonar S8482:
          # a saved body can be echoed when an assertion fails, which turns "expected
          # X, got ''" into something diagnosable; and `curl | python3` is the shape of
          # `curl | bash` even when the interpreter only ever treats stdin as data.

          # 2. The backend is OURS, not a wildcard-caught stranger. A bare 200 proves
          #    nothing here — a parked host, a Caddy default and the marketing site all
          #    answer 200 — so assert the body identifies the service.
          curl -s --max-time 20 -o /tmp/health.json "https://${DOMAIN}/api/health" || true
          svc="$(python3 -c 'import json; print(json.load(open("/tmp/health.json")).get("service",""))' 2>/dev/null || true)"
          echo "  /api/health service = ${svc}"
          if [ "$svc" != "restaurant-system-api" ]; then
            note "/api/health did not identify as restaurant-system-api (got '${svc}')"
            echo "  body was: $(head -c 300 /tmp/health.json 2>/dev/null)"
          fi

          # 3. It has its OWN database, seeded from the registry — not a copy of another
          #    tenant's. This is the check that a wrong db/db_role would fail.
          curl -s --max-time 20 -o /tmp/info.json "https://${DOMAIN}/api/restaurant-info" || true
          name="$(python3 -c 'import json; print((json.load(open("/tmp/info.json")).get("data") or {}).get("name",""))' 2>/dev/null || true)"
          echo "  seeded restaurant name = ${name}"
          if [ "$name" != "$TENANT_NAME" ]; then
            note "seeded name was '${name}', expected '${TENANT_NAME}' — the registry identity did not reach the database"
            echo "  body was: $(head -c 300 /tmp/info.json 2>/dev/null)"
          fi

          # 4. The cert is for THIS host. A wildcard or a stale cert would mean the Caddy
          #    site block never took effect.
          subj="$(echo | openssl s_client -servername "${DOMAIN}" -connect "${DOMAIN}:443" 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || true)"
          echo "  cert ${subj}"
          case "$subj" in *"${DOMAIN}"*) ;; *) note "certificate subject does not mention ${DOMAIN}: ${subj}" ;; esac

          # 5. It serves ONLY what the registry sold it. A fresh tenant enforces by default
          #    (tenants/templates/tenant.env.tpl), and this is the only automated place that
          #    observes it: the registry entry lists `modules: [core]`, so an unrestricted
          #    tenant reports the whole eight-id vocabulary and is caught here. Before the
          #    default existed, every self-serve tenant was exactly that — a customer paying
          #    for Core receiving all eight — and nothing in the funnel noticed.
          #    The flag and the ids are BOTH asserted, because each catches a different
          #    failure. `enforced:false` catches the flag being lost AND the list being
          #    empty (the backend computes IsEnforced = Enforce && known.Length > 0, so an
          #    empty Modules:Enabled reports false). The ids catch the case the flag cannot:
          #    a WRONG-but-non-empty list, which reports enforced:true and quietly hands the
          #    tenant a different product than the registry sold it.
          # `core` is unioned in because the backend returns it whether or not the list
          # names it (IsEnabled rule 3, TenantModules.cs:74). Without this, widening the
          # fixture to a list that omits `core` would red the smoke for the one reason
          # that is correct behaviour.
          # Whitespace is stripped first, mirroring provision-tenant.sh's strip_ws: a
          # comma list written `core, cashier` is normal YAML and ` cashier` would sort
          # ahead of everything and never match.
          expect_mods="yes $({ echo "$MODULES" | tr ',' '\n'; echo core; } \
            | sed 's/[[:space:]]//g; /^$/d' | sort -u | paste -sd, -)"
          curl -s --max-time 20 -o /tmp/modules.json "https://${DOMAIN}/api/tenant/modules" || true
          mods="$(python3 -c 'import json; d=(json.load(open("/tmp/modules.json")).get("data") or {}); print(("yes" if d.get("enforced") else "no")+" "+",".join(sorted(d.get("modules") or [])))' 2>/dev/null || true)"
          echo "  /api/tenant/modules enforced+ids = ${mods}"
          if [ "$mods" != "$expect_mods" ]; then
            note "expected '${expect_mods}' from /api/tenant/modules, got '${mods}' — a fresh tenant did not come up enforcing its registry list"
            echo "  body was: $(head -c 300 /tmp/modules.json 2>/dev/null)"
          fi

          [ "$fail" = "0" ] || exit 1
          echo "all checks passed"

      - name: Verify the registry reached the container (email languages)
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          # GAP-2 S9. The languages list is the one registry field with no public endpoint
          # to observe it: it decides what language this tenant's MAIL is written in, and
          # mail is exactly what a smoke run cannot receive. So it is asserted where it
          # lands — the container's own environment — rather than left to the first guest
          # who orders in French to discover.
          #
          # `Localization__SupportedLanguages` and not `TENANT_LANGUAGES`: the second has
          # been rendered into every tenant since ADR-010 as a plain record, and asserting
          # it would pass on precisely the state S9 exists to fix (rendered, bound to
          # nothing). An EMPTY value is a legitimate configuration meaning "all ten", which
          # is why this is equality with the fixture rather than "non-empty".
          #
          # The container is found by its COMPOSE LABELS, not by a guessed name: the
          # project is `tenant-<slug>` and the service is `backend-<slug>`, so the actual
          # name is `tenant-smoke-backend-smoke-1` and any hand-built string is one
          # template edit away from silently matching nothing. Env is fetched whole and
          # grepped HERE, so the remote command carries no nested quoting.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "${STAGING_USER}@${STAGING_HOST}" \
            "docker ps -q --filter label=com.docker.compose.project=tenant-${SLUG} --filter label=com.docker.compose.service=backend-${SLUG} | head -1 | xargs -r docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}'" \
            > /tmp/tenant-env.txt || true
          env_line="$(grep '^Localization__SupportedLanguages=' /tmp/tenant-env.txt || true)"
          echo "  container env: ${env_line:-<absent>}"
          if [ "$env_line" != "Localization__SupportedLanguages=${LANGUAGES}" ]; then
            echo "::error::expected 'Localization__SupportedLanguages=${LANGUAGES}' in the tenant container, got '${env_line:-<absent>}'"
            echo "::error::the registry's languages list did not reach the backend — this tenant would mail its guests in the wrong language"
            exit 1
          fi
          echo "registry languages reached the container"

          # backend #363, same reasoning one level weaker. TENANT_TIMEZONE is an OPERATOR
          # control, so a smoke tenant has none and the correct value here is the EMPTY
          # string — which is exactly why it is worth asserting: an absent KEY and an empty
          # VALUE look identical to a guest and mean different things to compose. Present
          # and empty proves the template wiring; the backend then applies its own
          # Europe/Zurich default, which is the state every tenant provisioned today is in.
          tz_line="$(grep '^Localization__TimeZone=' /tmp/tenant-env.txt || true)"
          echo "  container env: ${tz_line:-<absent>}"
          if [ "$tz_line" != "Localization__TimeZone=" ]; then
            echo "::error::expected an empty 'Localization__TimeZone=' in the tenant container, got '${tz_line:-<absent>}'"
            echo "::error::the wall-clock key is not wired — this tenant would print the wrong hour in every mail with no way to correct it"
            exit 1
          fi
          echo "the wall-clock key reached the container"

      - name: Destroy the tenant
        if: always()
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          # ALWAYS, including on a failed verify: a smoke tenant left running is a
          # half-built instance on a live box and a slug that cannot be re-run. `--purge`
          # removes /opt/rumi/tenants/<slug>, which is what next week's guard checks for.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "${STAGING_USER}@${STAGING_HOST}" \
            "cd /opt/rumi/deploy && ./deprovision-tenant.sh '${SLUG}' --drop-db --purge"

      - name: Confirm nothing was left behind
        if: always()
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          left="$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "${STAGING_USER}@${STAGING_HOST}" \
            "ls -d /opt/rumi/tenants/${SLUG} 2>/dev/null; docker ps -a --format '{{.Names}}' | grep '${SLUG}' || true")"
          if [ -n "$left" ]; then
            echo "::error::teardown incomplete, still present:"
            echo "$left"
            exit 1
          fi
          echo "box is clean"

  # Its own job, so a failure in EITHER job is reported. It used to be a step inside the
  # single smoke job; once the image build moved out, a build failure would have gone to
  # nobody but the Actions tab on a Monday morning.
  report:
    name: report a failure where it will be seen
    needs: [image, smoke]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # An issue, deduped by title, so a repeated failure appends rather than filling
          # the tracker. A scheduled run has no PR to comment on and nobody watching the
          # Actions tab on a Monday morning.
          title="Provisioning smoke failed"
          body="$(printf '%s\n' \
            "The weekly provisioning smoke failed. Provisioning is the path every new" \
            "customer takes, so treat this as broken onboarding until proven otherwise." \
            "" \
            "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- slug: \`${SLUG}\` (${DOMAIN})" \

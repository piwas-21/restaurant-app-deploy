# ============================================================================
# CI — lint + config-scan the deploy repo's infra files
# ----------------------------------------------------------------------------
# Until now this repo (the source of truth for box infra) had NO CI: the shell
# scripts and the production compose went un-linted while being the live SaaS's
# deploy surface. DEV-PHASES-PLAN §4.5 (deploy CI additions), closing the
# D1/D9/D10 gaps in the §2 matrix for this repo.
#
# Gates, all on PRs + pushes to main:
#   - shellcheck    : BLOCKING. Static analysis of every *.sh (warning severity —
#                     the tree is already clean at this level, so it's a real gate).
#   - script tests  : BLOCKING. Every tests/*.sh, discovered by glob rather than named
#                     one by one. Added 2026-08-18 after a real provision failed on
#                     something no linter can see — a generated password that broke the
#                     BACKEND's password policy, a rule living in another repo's C#.
#                     Point 1 below ("almost nothing here a linter can check") is still
#                     true and is exactly why this job is not a linter.
#   - compose config: BLOCKING. `docker compose config -q` on the production
#                     compose file. Cheap, and it is the file that deploys prod:
#                     a YAML/interpolation error here is a broken box, discovered
#                     by the deploy rather than by CI.
#   - trivy config  : misconfiguration scan of the tree. Honest note, because the
#                     previous comment here promised more than the job delivered:
#                     Trivy has NO docker-compose misconfiguration scanner, so
#                     pointing it at docker-compose.prod.yml scanned nothing at all
#                     ("Not scanned" in the summary table of every run). It now
#                     scans the whole tree, so it covers a Dockerfile/Kubernetes/
#                     Terraform file the moment one lands here.
#
# WHY THE GATES ARE THIN, honestly. The comment that used to sit here said "This
# repo is PRIVATE -> Actions bills paid minutes". That is FALSE — the repo is
# public (`gh api repos/piwas-21/restaurant-app-deploy --jq .visibility`), so its
# Actions minutes are FREE and cost has never been a reason to keep anything out.
# The real reasons, which are about signal rather than money:
#   1. There is almost nothing here that a linter can check. The repo is shell
#      scripts, a compose file, Caddyfiles and a tenant registry — no application
#      code, no test suite, no build.
#   2. The load-bearing gate for this repo is not CI at all, it is
#      provisioning-smoke.yml: weekly, unmocked, it runs these very scripts against
#      a real box and stands a real tenant up and down. That covers what a linter
#      structurally cannot.
#   3. What CI can add is fast structural checks, and since minutes are free the
#      only cost of adding one is the latency of a PR. If a check is worth having,
#      the honest answer is now "add it", not "we cannot afford it".
# permissions: contents: read only. No box secrets are touched here (that's
# sync-to-box.yml); this only reads + lints.
# ============================================================================
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - "**.yml"
      - "**.yaml"
      - "Dockerfile*"
      - ".github/workflows/ci.yml"
      # The secret-scanning inputs (#161). Without these a push to `main` that
      # changes ONLY the gitleaks config or the detect-secrets baseline runs no
      # CI at all — i.e. the one change most able to weaken these gates is the
      # one that would go unchecked. PRs are unaffected (`pull_request:` carries
      # no filter); this is the release-to-main path.
      - ".gitleaks.toml"
      - ".secrets.baseline"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions are declared per JOB below, never at workflow level (Sonar
# githubactions:S8264).

jobs:
  shellcheck:
    name: shellcheck (*.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: shellcheck (preinstalled on ubuntu-latest)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.sh .ssh/*.sh )
          if [ ${#files[@]} -eq 0 ]; then echo "no *.sh found"; exit 0; fi
          printf 'Linting %d script(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          files+=( tests/*.sh )
          shellcheck --severity=warning --color=always "${files[@]}"

  # The first executable test this repo has ever had, and it exists because a real
  # provision died on 2026-08-18 for a reason no linter can see: the generated admin
  # bootstrap password broke the BACKEND's own password policy. `shellcheck` cannot know
  # about a rule that lives in another repo's C#, and the only other thing that would have
  # caught it is a customer's failed onboarding — the shape this repo keeps being bitten
  # by. See tests/admin-password.sh for the measurement.
  unit_tests:
    name: script unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Every tests/*.sh, discovered rather than listed. The step used to name
      # tests/admin-password.sh explicitly, which meant the second test file added to
      # this repo would have sat there, green, never run — the "gate that silently
      # covers nothing" shape this workflow's own header complains about.
      - name: Run every tests/*.sh
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( tests/*.sh )
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no tests/*.sh found"; exit 1; fi
          for t in "${files[@]}"; do
            printf '\n=== %s ===\n' "$t"
            bash "$t"
          done

  # Renamed from `trivy_config` when the compose validation was added; the
  # `main-develop` ruleset's required-status-check list was updated in the same
  # change, since a required check that no longer exists silently stops requiring
  # anything.
  config_checks:
    name: config checks (compose validate + trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Structural validation of the file that deploys production. Unset variables
      # are warnings, not errors (compose defaults them to ""), so this fails on a
      # genuine YAML/interpolation/schema error and nothing else — which is exactly
      # the class that turns into a broken box at deploy time.
      - name: Validate the production compose file
        run: docker compose -f docker-compose.prod.yml config --quiet

      # Was pointed at docker-compose.prod.yml with exit-code 0 as a "bed-in".
      # Trivy has no docker-compose misconfiguration scanner, so that combination
      # scanned NOTHING ("Not scanned" in every run's summary table) and could never
      # have failed — a gate in name only. Pointed at the tree it covers a
      # Dockerfile/Kubernetes/Terraform file the moment one lands, and it can be
      # blocking honestly: there is nothing here for it to find today, so flipping
      # exit-code cannot break a green tree, only a future bad file.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          hide-progress: "true"

  # ── Secret scanning (#161) ───────────────────────────────────────────────────
  # This repo had NO secret scanner at any layer while three of the five app repos
  # did, and it is the one where a pasted credential is most likely to land: it is
  # the box-infra source of truth, and every merge rsyncs to BOTH boxes.
  #
  # Two scanners, because they answer different questions and the pre-commit hook
  # added alongside them answers a third:
  #
  #   * the hook   — the fast local one. It only ever sees files git already knows
  #                  about, and only when it is installed. Measured: an UNTRACKED
  #                  file carrying a valid AWS key passes it silently. That is not
  #                  a bug in the hook, it is the reason neither of these jobs is
  #                  redundant with it.
  #   * gitleaks   — scans COMMITS, so a credential committed and later deleted is
  #                  still found. Note what that means for anyone testing it by hand:
  #                  `gitleaks detect` reads history, not the working tree, so an
  #                  uncommitted file is invisible to it and a hand-check that edits a
  #                  file without committing proves nothing. Verified in both
  #                  directions ON A COMMIT: clean tree exits 0, a random AWS key
  #                  exits 1. Use a RANDOM key for that — gitleaks deliberately
  #                  allowlists the well-known documentation values
  #                  (`AKIAIOSFODNN7EXAMPLE`), so a control built from one is silently
  #                  vacuous.
  #   * detect-secrets — runs the identical check the hook runs, against the same
  #                  baseline, so a contributor who never ran `setup_hooks.sh`
  #                  cannot skip it and a stale baseline is caught here.
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history — the point of gitleaks over the baseline scan.
          fetch-depth: 0
      - name: Install gitleaks
        # Retried, unlike the copy of this step in the other repos: a single
        # `curl` makes a REQUIRED check fail on a transient GitHub 5xx, which is a
        # red PR that says "secret found" and means "the release download hiccuped"
        # (piwas-21/sofra#177). `--retry-all-errors` is what makes it cover 5xx and
        # not just connection failures.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Downloaded to disk and CHECKSUMMED before it is unpacked, rather than piped
          # straight into `tar`. Every action in this repo is SHA-pinned; a release asset
          # is mutable, so piping one into `tar` and then `sudo mv`-ing the result into
          # /usr/local/bin was the one step that trusted a name instead of a digest.
          # `--proto '=https'` pins the scheme across REDIRECTS too, not just the first
          # request: `-L` will happily follow a 302 to http:// otherwise, which is a
          # downgrade on the path that installs a binary we then run as root
          # (Sonar githubactions:S6506).
          CURL=(curl -sSfL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 3 --retry-all-errors)
          "${CURL[@]}" -o "/tmp/${ASSET}" "${BASE}/${ASSET}"
          "${CURL[@]}" -o /tmp/gitleaks-checksums.txt \
            "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          ( cd /tmp && grep " ${ASSET}\$" gitleaks-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${ASSET}" -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --verbose --redact --source .

  detect_secrets:
    name: detect-secrets (baseline parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Pinned to the same version the pre-commit hook uses. If these drift, the
      # hook and this job can disagree about the same file, which is worse than
      # having only one of them.
      - name: Install detect-secrets
        # `--only-binary :all:` refuses a source distribution, so no package's setup.py
        # executes on the runner during install (Sonar githubactions:S8541). detect-secrets
        # publishes a wheel, so this costs nothing and closes the arbitrary-code path.
        # A block scalar, not an inline one: `--only-binary :all: detect-secrets` contains
        # a colon-space, which YAML reads as a mapping and rejects.
        run: |
          pip install --disable-pip-version-check --only-binary :all: detect-secrets==1.5.0
      - name: Scan against the baseline
        run: |
          set -euo pipefail
          # `git ls-files` rather than a glob: the baseline records paths as git
          # knows them, and an unlisted path would be scanned under a name the
          # baseline cannot match, reporting a "new" secret that is already known.
          #
          # `-r` because xargs with EMPTY input otherwise runs the command once with
          # no filenames, and detect-secrets-hook exits 0 on no files — a job that
          # scanned nothing and reported success. `git ls-files` cannot be empty in
          # this repo, which is exactly why the failure would never be noticed.
          count="$(git ls-files | wc -l | tr -d ' ')"
          echo "scanning $count tracked files"
          [ "$count" -gt 0 ] || { echo "::error::no tracked files to scan"; exit 1; }
          git ls-files -z | xargs -0 -r detect-secrets-hook --baseline .secrets.baseline

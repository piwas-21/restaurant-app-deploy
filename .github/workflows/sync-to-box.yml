name: sync-to-box

# Push the deploy artifacts (compose, Caddyfile, deploy.sh, provision/gen
# scripts, templates) to the production box on every change. The box is a plain
# directory, not a git checkout — this repo is the source of truth and CI keeps
# the box in sync. App image rollouts are handled by each app repo's deploy.yml;
# this only syncs the static infra files.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (matches a key in
# rumi@box:~/.ssh/authorized_keys), DEPLOY_KNOWN_HOSTS (box host keys, pins
# against MITM).
#
# Note: a compose/Caddyfile change only takes effect on the next deploy
# (`./deploy.sh` / a `caddy reload`); this job copies files, it does not restart
# the stack.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DEPLOYMENT.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

# Permissions are declared per JOB below, never at workflow level (Sonar
# githubactions:S8264).

jobs:
  sync:
    name: rsync deploy files to prod box
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure SSH (pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to /opt/rumi/deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        # No --delete, deliberately and permanently. The destination is NOT a mirror of
        # this repo: provision-tenant.sh writes `caddy-tenants/<slug>.caddy` INSIDE
        # /opt/rumi/deploy for every live tenant (provision-tenant.sh:675, removed again by
        # deprovision-tenant.sh:59), and those files exist nowhere in git. `--delete` would
        # remove every live tenant's Caddy site block on the next push to main — every tenant
        # site off the internet until someone re-provisioned. Protected runtime files
        # (.env, app-secrets.json, dozzle-users.yml) and CI/local-only paths are excluded
        # outright; the drift that a missing --delete leaves behind is REPORTED by the next
        # step instead of being repaired destructively.
        run: |
          rsync -az --human-readable --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.ssh/' \
            --exclude='.env' \
            --exclude='app-secrets.json' \
            --exclude='dozzle-users.yml' \
            --exclude='*.bak' \
            --exclude='*.bak.*' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/rumi/deploy/"

      # The cost of not using --delete is that a file deleted from this repo lives on the
      # box forever, silently. This makes that visible without touching anything: a DRY-RUN
      # --delete whose output is printed, never executed. Runtime-owned paths are excluded
      # from the report too, so what remains is genuinely a leftover rather than the normal
      # working state of a provisioned box.
      - name: Report on-box files this repo no longer has (never deletes)
        continue-on-error: true
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -uo pipefail
          echo "Files present on the box but not in this repo (report only — nothing is deleted):"
          rsync -az --dry-run --delete --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.ssh/' \
            --exclude='.env' \
            --exclude='app-secrets.json' \
            --exclude='dozzle-users.yml' \
            --exclude='*.bak' \
            --exclude='*.bak.*' \
            --exclude='caddy-tenants/*.caddy' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/rumi/deploy/" \
            | grep '^\*deleting' || echo "  (none — the box matches the repo)"

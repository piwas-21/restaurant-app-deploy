name: sync-registry-to-staging

# Sync ONLY tenants/registry.yml to the staging box, on every develop push that
# touches it.
#
# Why this exists (the ADR-012 chain had a hole): the sofra control plane opens its
# tenant registry PR against `develop` (GitFlow — CLAUDE.md rule 2b), but the box
# rsync (sync-to-staging.yml) runs on pushes to `main`. So a merged provisioning PR
# never reached the box, and the provision-tenant Action that follows it failed with
# "unknown slug" until someone released develop→main or hand-dispatched a re-sync.
# The registry is DATA, not infra code — the box reads it, the scripts key off it —
# so tracking develop for that one file closes the gap without shipping unreleased
# compose/Caddy/script changes to a live box.
#
# Deliberately narrow:
#   * ONE file. tenants/templates/*.tpl live in the same directory but are infra
#     code (compose/caddy/env rendering) and stay on the main-only path.
#   * Staging box only. The prod box's registry holds tenant 1 (managed: legacy,
#     which provision-tenant.sh refuses to touch) and gains nothing from develop
#     tracking; cross-box prod provisioning is out of ADR-012's scope.
#   * Copies the file and nothing else. This workflow still provisions nothing —
#     but as of SOFRA-ONBOARDING-PLAN O3 (option B) its SUCCESS is what chains
#     provision-on-registry-merge.yml, which builds the tenant image and runs
#     provision-tenant.sh. So a merge to develop that adds a `status: provisioning`
#     staging tenant now DOES stand up infrastructure, and this header no longer
#     claims otherwise. The review checkpoint moved to the merge itself rather than
#     disappearing (ADR-012 invariant 3); re-provisioning a live tenant is still an
#     explicit provision-tenant.yml dispatch.

on:
  push:
    branches: [develop]
    paths:
      - "tenants/registry.yml"
  workflow_dispatch:
    inputs:
      deprovision_slug:
        description: "OPTIONAL teardown: registry slug to deprovision after the sync (empty = sync only)"
        required: false
        type: string
        default: ""
      deprovision_mode:
        description: "How much to remove (see deprovision-tenant.sh)"
        required: false
        type: choice
        default: teardown
        options:
          - teardown
          - drop-db
          - purge
      deprovision_confirm:
        description: "REQUIRED iff a slug is given: re-type the slug to confirm"
        required: false
        type: string
        default: ""

concurrency:
  # Shares sync-to-staging.yml's group: two rsyncs into /opt/rumi/deploy at once
  # is exactly the race worth serialising.
  group: staging-deploy
  cancel-in-progress: false

# Permissions are declared per JOB below, never at workflow level (Sonar
# githubactions:S8264).

jobs:
  sync-registry:
    name: rsync tenants/registry.yml to staging box
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure SSH (pinned host key)
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync tenants/registry.yml
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          rsync -az --human-readable --itemize-changes \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./tenants/registry.yml "${STAGING_USER}@${STAGING_HOST}:/opt/rumi/deploy/tenants/registry.yml"

  teardown:
    # The on-box half of deprovision-tenant.sh, piggybacked on THIS workflow because
    # GitHub never registered the standalone deprovision-tenant.yml (#166/#167/#168/#169:
    # added, touched, removed and re-added by pushes to main — the Actions workflow index
    # still 404s it). Registered workflows re-read their file from the default branch on
    # every dispatch, so the guarded job here is the path that actually runs. Delete this
    # job (and dispatch the standalone file instead) the day the index catches up.
    #
    # Guards mirror deprovision-tenant.yml: grammar-gated slug, confirm must re-type it,
    # mode maps to the script's own escalation, and the script re-validates the on-box
    # registry (managed / box / archive-before-destroy) as defence in depth.
    name: teardown a tenant on the staging box
    needs: sync-registry
    if: ${{ inputs.deprovision_slug != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Validate teardown inputs
        id: args
        env:
          RAW_SLUG: ${{ inputs.deprovision_slug }}
          CONFIRM: ${{ inputs.deprovision_confirm }}
          MODE: ${{ inputs.deprovision_mode }}
        run: |
          if [[ ! "$RAW_SLUG" =~ ^[a-z0-9][a-z0-9-]{1,30}$ ]]; then
            echo "::error::invalid slug (must match ^[a-z0-9][a-z0-9-]{1,30}\$)"
            exit 1
          fi
          if [[ "$CONFIRM" != "$RAW_SLUG" ]]; then
            echo "::error::deprovision_confirm does not match the slug — type it exactly to confirm"
            exit 1
          fi
          case "$MODE" in
            teardown) FLAGS='' ;;
            drop-db)  FLAGS='--drop-db' ;;
            purge)    FLAGS='--drop-db --purge' ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          {
            echo "slug=$RAW_SLUG"
            echo "flags=$FLAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH (pinned host key)
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deprovision-tenant.sh on the box
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          SLUG: ${{ steps.args.outputs.slug }}
          FLAGS: ${{ steps.args.outputs.flags }}
        run: |
          # FLAGS is built above from the closed mode choice — never from raw input.
          # shellcheck disable=SC2086
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${STAGING_USER}@${STAGING_HOST}" \
            "cd /opt/rumi/deploy && ./deprovision-tenant.sh '${SLUG}' ${FLAGS}"

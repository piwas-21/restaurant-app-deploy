name: deprovision-tenant  # (re-)registered with Actions by the push that touched this file on main

# The tear-down counterpart to provision-tenant.yml. Runs
# `deprovision-tenant.sh <slug>` on the STAGING box over SSH, reusing the same
# sync-to-staging SSH secrets and the same guards:
#
#   - the registry (tenants/registry.yml) is the source of truth and must already
#     be committed AND synced to the box BEFORE this is invoked — the script reads
#     the on-box registry and refuses an unknown / managed:legacy / wrong-box slug;
#   - the slug is grammar-gated here AND re-validated by the script;
#   - `confirm` must re-type the slug, so a fat-fingered slug field alone cannot
#     destroy anything.
#
# Modes mirror the script's own escalation (never more destructive than asked):
#   teardown : stop traffic + containers, clear the completion marker; data kept
#   drop-db  : + archive (DB + uploads, 24-month retention), then DROP DATABASE + ROLE
#   purge    : + remove volumes and /opt/rumi/tenants/<slug> — COMPLETE removal;
#              implies --drop-db because the script archives before either destroys
#
# The script NEVER deletes a backup and refuses real tenants without an archive
# (`--no-archive` is not exposed here on purpose). The old obresse.sofrapiwas.com
# alias / retired entries are skipped by every refresh chain on `status: retired`.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Registry slug to deprovision (must be synced in tenants/registry.yml)"
        required: true
        type: string
      mode:
        description: "How much to remove"
        required: true
        type: choice
        default: teardown
        options:
          - teardown
          - drop-db
          - purge
      confirm:
        description: "Type the slug again to confirm (e.g. obresse)"
        required: true
        type: string

concurrency:
  # Serialise with provision-tenant.yml too: both touch shared Caddy/compose on the box.
  group: provision-tenant
  cancel-in-progress: false

jobs:
  deprovision:
    name: deprovision tenant on the box
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        id: args
        env:
          RAW_SLUG: ${{ inputs.slug }}
          CONFIRM: ${{ inputs.confirm }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ ! "$RAW_SLUG" =~ ^[a-z0-9][a-z0-9-]{1,30}$ ]]; then
            echo "::error::invalid slug (must match ^[a-z0-9][a-z0-9-]{1,30}\$)"
            exit 1
          fi
          if [[ "$CONFIRM" != "$RAW_SLUG" ]]; then
            echo "::error::confirm does not match slug — type the slug exactly to confirm"
            exit 1
          fi
          case "$MODE" in
            teardown) FLAGS='' ;;
            drop-db)  FLAGS='--drop-db' ;;
            purge)    FLAGS='--drop-db --purge' ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          {
            echo "slug=$RAW_SLUG"
            echo "flags=$FLAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH (pinned host key)
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deprovision-tenant.sh on the box
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          SLUG: ${{ steps.args.outputs.slug }}
          FLAGS: ${{ steps.args.outputs.flags }}
        run: |
          # FLAGS is built above from the closed `mode` choice — never from raw input.
          # shellcheck disable=SC2086
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${STAGING_USER}@${STAGING_HOST}" \
            "cd /opt/rumi/deploy && ./deprovision-tenant.sh '${SLUG}' ${FLAGS}"

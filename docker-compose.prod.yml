# RUMI production stack — single Netcup RS 2000 box, tenant 1 (rumirestaurant.ch)
# Images are prebuilt in CI and pulled from GHCR (see each repo's
# .github/workflows/build-image.yml) — no source checkout or on-box build.
# Only this folder is needed on the server:
#   /opt/rumi/deploy   <- compose, Caddyfile, .env, app-secrets.json
#
# Per-service image tags are pinned in .env: BACKEND_TAG / FRONTEND_TAG (each
# default: latest). deploy.sh persists these, so a rollback pins one service
# without touching the other. Deploy/rollback via each repo's deploy workflow,
# or on the box:  BACKEND_TAG=sha-<hex> ./deploy.sh
# Deploy:  docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Logs:    docker compose -f docker-compose.prod.yml logs -f backend

# Container resource limits (DEV-PHASES-PLAN W0/§4.5, sized 2026-07-07 from
# `docker stats` on BOTH boxes — prod idles ~315MiB total on 15.6GiB, staging
# ~505MiB on 7.8GiB): limits are generous OOM/runaway guardrails (3-8x observed
# peak), not tight quotas. mem_limit OOM-kills just the container (restart:
# unless-stopped recovers it) instead of letting a leak take down the box.
# Must fit the SMALLER staging box: base+sofra = 4.75g of 7.8g (postgres cap
# 1g→2g with max_connections=300, 2026-07-09 — headroom for per-tenant Npgsql
# pools; workspace cost plan §5.2). Tenant capacity/placement math lives in the
# workspace docs/plans/SOFRA-COST-AND-CAPACITY-PLAN.md §3 — provisioned tenants
# belong on prod; each is capped ~1.75g (tenants/templates/docker-compose.tenant.yml.tpl).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Bcrypt hash for the /dev-portal Basic Auth gate (see Caddyfile). Set in
      # the box's .env (gitignored), generated via `caddy hash-password`. Never
      # the plaintext password, and never committed.
      DEV_PORTAL_AUTH_HASH: "${DEV_PORTAL_AUTH_HASH}"
      # Site address for Caddyfile.staging's {$STAGING_DOMAIN}. Defaults to the staging
      # box's hostname if unset, so a box that forgets to set it still comes up (avoids
      # an empty site address). Prod's ./Caddyfile never references this var, so the
      # value passed on the prod box is simply unused — harmless.
      STAGING_DOMAIN: "${STAGING_DOMAIN:-v2202607374190477434.megasrv.de}"
      # Sofra landing-page site addresses for Caddyfile.staging ({$SOFRA_DOMAIN} /
      # {$SOFRA_WWW_DOMAIN}). Defaults use an http:// scheme on purpose: a box that
      # doesn't set them still parses the Caddyfile and never attempts a Let's
      # Encrypt issuance for a placeholder host. Prod's ./Caddyfile ignores both.
      SOFRA_DOMAIN: "${SOFRA_DOMAIN:-http://sofra-unset.localhost}"
      SOFRA_WWW_DOMAIN: "${SOFRA_WWW_DOMAIN:-http://www.sofra-unset.localhost}"
      # Same http:// placeholder rule for the develop-tracking staging control plane.
      SOFRA_STAGING_DOMAIN: "${SOFRA_STAGING_DOMAIN:-http://sofra-staging-unset.localhost}"
    volumes:
      # Which Caddyfile to mount is env-selectable so the SAME compose file drives
      # both boxes: prod leaves CADDYFILE unset (-> ./Caddyfile, www.rumirestaurant.ch),
      # the staging box sets CADDYFILE=./Caddyfile.staging in its .env. Behaviour is
      # byte-identical to before on prod (the default resolves to ./Caddyfile).
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro        # serve /uploads/* straight off the backend's upload volume
      # Tenant provisioning (S14, sofra ADR-001/003): per-tenant site blocks
      # rendered by provision-tenant.sh, imported by Caddyfile.staging. A
      # DIRECTORY mount on purpose — new files appear without a recreate and a
      # plain `caddy reload` re-globs the imports (the inode gotcha only bites
      # single-file mounts). Prod's ./Caddyfile has no import line, so this is
      # inert there.
      - ./caddy-tenants:/etc/caddy/tenants:ro
      # Parent dir of every tenant's bind-mounted uploads/ — lets the shared
      # Caddy file_server tenant uploads at /srv/tenants/<slug>/uploads. Auto-
      # created empty on boxes with no tenants; unreferenced by prod's Caddyfile.
      - /opt/rumi/tenants:/srv/tenants:ro
      - caddy_data:/data               # ACME certs/keys — persist so we don't re-issue
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [rumi]

  frontend:
    # NEXT_PUBLIC_* are baked into this image at CI build time (see the repo's
    # build-image.yml). Changing the API URL/domain requires a CI rebuild.
    image: ghcr.io/piwas-21/restaurant-app-frontend:${FRONTEND_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      # Error tracking (DEV-PHASES W3) — SERVER-SIDE only (SSR/route-handler/RSC).
      # Browser capture is deferred (needs a CSP change, frontend §9). Read at
      # runtime; empty -> the SDK is a no-op. SENTRY_ENVIRONMENT labels per box.
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
    depends_on:
      - backend
    networks: [rumi]

  backend:
    image: ghcr.io/piwas-21/restaurant-app-backend:${BACKEND_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Aspire components: AddNpgsqlDataSource("restaurantdb") + AddRedisDistributedCache("redis")
      # expect connection strings named "restaurantdb" / "redis" (NOT DefaultConnection).
      # Maximum Pool Size caps this backend's Npgsql pool (default 100) so N
      # backends can't exhaust the shared postgres (cost plan §5.2).
      ConnectionStrings__restaurantdb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=20"
      ConnectionStrings__redis: "redis:6379"
      # Error tracking (DEV-PHASES W3 follow-up) — same switch as the frontend
      # block below: read at runtime; empty -> the SDK never initializes.
      # Errors only (no PII, no request bodies, tracing off). SENTRY_ENVIRONMENT
      # labels events per box (both boxes run ASPNETCORE_ENVIRONMENT=Production).
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      # Fleet observability roll-up (Track S) — this backend pushes its device roster +
      # missed-order/error counts to the one sofra control plane (/admin/fleet). Shared bearer
      # from the box .env; the slug is this deployment's own (RUMI = the main stack). Inert until
      # PRINTER_TELEMETRY_SECRET is set (FleetSummaryPushService self-guards on an empty secret).
      # This compose runs on BOTH boxes, so the STAGING box must set FLEET_PUSH_ENABLED=false (else
      # the staging RUMI backend would push as "rumi" too and clobber prod's fleet rows).
      FleetPush__Enabled: "${FLEET_PUSH_ENABLED:-true}"
      FleetPush__SofraIngestUrl: "${FLEET_INGEST_URL:-https://sofrapiwas.com/api/telemetry/fleet}"
      FleetPush__Secret: "${PRINTER_TELEMETRY_SECRET:-}"
      FleetPush__TenantSlug: "${FLEET_TENANT_SLUG:-rumi}"
      # E2E menu fixture (backend #238) — seeds a mixed-kitchen bundle the printer-app E2E suite
      # needs to assert kitchen routing, which staging could not provide because it ships no
      # products. Unlike every other seeder it inserts a VISIBLE, ORDERABLE product, so this is the
      # INVERSE of the FleetPush switch above: it defaults to FALSE and only the STAGING box opts
      # in with SEED_E2E_MENU_FIXTURES=true. Forgetting FLEET_PUSH_ENABLED is loud; forgetting this
      # one has to be SAFE, because the failure mode is "E2E Menu Deal" on a paying tenant's menu.
      SeedSettings__SeedE2EMenuFixtures: "${SEED_E2E_MENU_FIXTURES:-false}"
      # Tenant→diner Stripe Connect (ADR-011 Job B, SOFRA-PAYMENTS-PLAN §4). The same three
      # variables the per-tenant template has carried since deploy #96 — RUMI had none of them,
      # so it was the one deployment on the fleet that could not take an online payment even in
      # principle: no env to fill meant Stripe:Enabled was structurally false rather than
      # deliberately false, and nothing said so.
      #
      # ALL THREE DEFAULT EMPTY/FALSE AND THIS CHANGES NOTHING TODAY. The backend's gateway
      # requires all three together (IStripeGateway.IsConfigured), so RUMI keeps answering
      # `available:false` and the checkout keeps hiding online payment until an operator sets
      # them on the box. This is the wiring, not the switch.
      #
      # The KEY is the BOX's, shared, on the same rail as PRINTER_TELEMETRY_SECRET above: a
      # Stripe restricted key cannot be bound to one acct_, so it is narrowed by permission and
      # by an Access policy pinning it to the box IPs instead. The ACCOUNT is RUMI's own —
      # Connect Standard, so the restaurant owns it outright and funds never pass through Sofra.
      #
      # ⚠️ This compose runs on BOTH boxes. Setting these on staging points the staging RUMI at
      # whatever account the key can reach, so leave them unset there unless a test account is
      # deliberately in play.
      Stripe__Enabled: "${STRIPE_ENABLED:-false}"
      Stripe__PlatformApiKey: "${STRIPE_PLATFORM_API_KEY:-}"
      Stripe__ConnectedAccountId: "${STRIPE_CONNECTED_ACCOUNT_ID:-}"
    volumes:
      - ./app-secrets.json:/app/app-secrets.json:ro   # all app secrets/config (git-ignored)
      - backend_keys:/app/keys                          # DataProtection keys — persist or every redeploy invalidates tokens/sessions
      - uploads:/app/wwwroot/uploads                    # Local file-storage provider writes here; Caddy serves it
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [rumi]
    # Backend auto-runs EF migrations + seeders on startup (MigrateApplicationDatabaseAsync()).
    # No manual migration step needed on a fresh DB.

  # Sofra marketing site (sofrapiwas.com) — staging box only, via compose profile:
  # the box opts in with COMPOSE_PROFILES=sofra in its .env, so prod's plain
  # `up -d` never pulls or starts it. Caddy must NOT depends_on this service
  # (a dependency on an inactive profile fails `up` on prod).
  sofra:
    image: ghcr.io/piwas-21/sofra:${SOFRA_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    profiles: [sofra]
    environment:
      # Waitlist intake (see the sofra repo's .env.example). Unset -> the API
      # returns 503 and the form falls back to a mailto link; the site still serves.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      WAITLIST_TO: "${WAITLIST_TO:-}"
      WAITLIST_FROM: "${WAITLIST_FROM:-Sofra Waitlist <onboarding@resend.dev>}"
      # Control plane (partner program — sofra ADR-008/009). Own DB + role on
      # the shared postgres server; RUMI's restaurantdb untouched. Migrations
      # are founder-run one-offs via ghcr.io/piwas-21/sofra-migrate — never on
      # container start (see DEPLOYMENT.md "Sofra control plane").
      DATABASE_URL: "postgresql://sofra:${SOFRA_DB_PASSWORD:-}@postgres:5432/sofra"
      AUTH_SECRET: "${SOFRA_AUTH_SECRET:-}"
      NEXTAUTH_URL: "${SOFRA_APP_URL:-https://sofrapiwas.com}"
      # Mollie subscription billing (S9, sofra ADR-011 Job A). Unset -> billing
      # UI shows "not configured" and the webhook 503s; the site still serves.
      MOLLIE_API_KEY: "${MOLLIE_API_KEY:-}"
      # Tenant registry, read-only (S6/ADR-007): /admin/tenants renders the
      # same synced YAML the provision scripts consume. The control plane
      # never writes it — lifecycle stays git + scripts (ADR-003).
      TENANT_REGISTRY_PATH: /data/tenants/registry.yml
      # ADR-012 git-native provisioning trigger: a fine-grained GitHub token
      # scoped to piwas-21/restaurant-app-deploy (Contents + Pull-requests:
      # write) that lets /admin/provision open a REVIEWABLE registry PR. It is
      # deliberately NOT the box SSH key — that stays in Actions secrets, so a
      # compromised container can propose a tenant but never provision one
      # (ADR-012 invariant 2). Empty -> /admin/provision shows "not configured".
      PROVISION_GITHUB_TOKEN: "${PROVISION_GITHUB_TOKEN:-}"
      # Data-retention cron (POST /api/cron/retention, GDPR storage-limitation).
      # CRON_SECRET must MATCH the CRON_SECRET GitHub Actions secret (the caller
      # workflow's bearer). DATA-LOSS class: the sweep purges nothing unless
      # RETENTION_ENABLED=true. Windows are left EMPTY here so the app's own
      # defaults (30d/18mo/12mo, in lib/retention-policy.ts) stay the single source
      # of truth — set a SOFRA_RETENTION_* box var only to override one.
      CRON_SECRET: "${SOFRA_CRON_SECRET:-}"
      # Fleet observability ingest (POST /api/telemetry/fleet). The bearer each tenant
      # backend's FleetSummaryPushService presents; must MATCH PRINTER_TELEMETRY_SECRET
      # on every tenant-backend box. Empty -> the route 503s (inert).
      PRINTER_TELEMETRY_SECRET: "${PRINTER_TELEMETRY_SECRET:-}"
      RETENTION_ENABLED: "${SOFRA_RETENTION_ENABLED:-false}"
      RETENTION_INVITE_TOKEN_DAYS: "${SOFRA_RETENTION_INVITE_TOKEN_DAYS:-}"
      RETENTION_AUDIT_LOG_MONTHS: "${SOFRA_RETENTION_AUDIT_LOG_MONTHS:-}"
      RETENTION_REJECTED_APPLICATION_MONTHS: "${SOFRA_RETENTION_REJECTED_APPLICATION_MONTHS:-}"
      # Error tracking (DEV-PHASES W3). SENTRY_DSN = server-side, read at runtime;
      # the BROWSER DSN (NEXT_PUBLIC_SENTRY_DSN) is a build arg, not here — sofra's
      # browser capture needs an image rebuild. Empty -> the SDK is a no-op.
      # SENTRY_ENVIRONMENT labels events per box (e.g. staging vs prod).
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
    volumes:
      # DIRECTORY mount (like caddy-tenants): rsync replaces registry.yml by
      # inode, a single-file mount would go stale after the first sync.
      - ./tenants:/data/tenants:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [rumi]

  # ── sofra STAGING (a second control plane, develop-tracking) ──────────────────
  # Same box, same shared postgres, its OWN database. Exists so the control plane can
  # be exercised against a DEPLOYED instance — env wiring, the founder-run migrate
  # one-off, Caddy, and the actually-published image — none of which the repo's local
  # e2e suite can see, however unmocked it is.
  #
  # profiles: [sofra-staging] — opt-in, exactly like the prod one. A box that does not
  # list it in COMPOSE_PROFILES never starts it.
  #
  # What is DELIBERATELY EMPTY here is the important part. Each of these is a live
  # capability on the prod service, and a staging copy holding it would act on the real
  # world with test data:
  #   PROVISION_GITHUB_TOKEN — would let a staging run open REAL registry PRs on the
  #                            deploy repo. /admin/provision shows "not configured".
  #   RESEND_API_KEY         — would email REAL people from a staging signup. Unset, the
  #                            app logs the mail instead of sending it.
  #   PRINTER_TELEMETRY_SECRET — would ingest real tenant fleet telemetry into staging.
  #   CRON_SECRET            — the retention sweep is DATA-LOSS class; no bearer, no run.
  # Do not "fix" any of these by copying the prod value across.
  sofra-staging:
    image: ghcr.io/piwas-21/sofra:${SOFRA_STAGING_TAG:-staging}
    pull_policy: always
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    profiles: [sofra-staging]
    environment:
      # Own database + role on the shared server. NEVER point this at `sofra`: the whole
      # value of the environment is that a destructive test cannot reach production data.
      DATABASE_URL: "postgresql://sofra_staging:${SOFRA_STAGING_DB_PASSWORD:-}@postgres:5432/sofra_staging"
      # Its own secret — sharing prod's would make a staging session token valid on
      # sofrapiwas.com.
      AUTH_SECRET: "${SOFRA_STAGING_AUTH_SECRET:-}"
      NEXTAUTH_URL: "${SOFRA_STAGING_APP_URL:-https://staging.sofrapiwas.com}"
      # The TEST Mollie key, and the reason this environment is worth having: billing
      # flows become exercisable against a deployed control plane. The app itself
      # refuses the dangerous combination — `webhookUrl()` throws if MOLLIE_WEBHOOK_URL
      # is set alongside a non-test key — but the real guard is here: never put a
      # `live_` key on this service.
      MOLLIE_API_KEY: "${MOLLIE_API_KEY_TEST:-}"
      # Read-only, same synced registry as prod, so /admin/tenants renders. The control
      # plane never writes it (ADR-003), and the mount below is :ro regardless.
      TENANT_REGISTRY_PATH: /data/tenants/registry.yml
      RETENTION_ENABLED: "false"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SOFRA_STAGING_SENTRY_ENVIRONMENT:-sofra-staging}"
    volumes:
      - ./tenants:/data/tenants:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [rumi]

  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    # max_connections raised from the 100 default: every backend instance brings
    # its own Npgsql pool (capped at 20 here + in the tenant tpl), plus sofra's
    # Prisma pool — the 100-conn default was the first multi-tenant limit
    # (cost plan §5.2). mem_limit 1g→2g sized for the higher connection ceiling.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rumi]
    # No host port published — DB reachable only on the internal docker network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    # maxmemory below the 256m container cap (Gemini triage on #22): the
    # backend uses redis as IDistributedCache — volatile-lru evicts only
    # TTL'd cache entries under pressure (graceful) instead of the container
    # getting OOM-killed; keys without TTL are never evicted.
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--maxmemory", "192mb",
        "--maxmemory-policy", "volatile-lru",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rumi]

  # Container log viewer (web UI) for ops/debugging. Reads the docker socket
  # read-only. NOT published to a host port — only reachable through Caddy at
  # /logs, and Dozzle enforces its own login (DOZZLE_AUTH_PROVIDER=simple, users
  # in ./dozzle-users.yml — gitignored, generated on the box like app-secrets.json).
  # See DEPLOYMENT.md "Viewing logs in the browser".
  dozzle:
    image: amir20/dozzle:v10.6.6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      DOZZLE_BASE: /logs           # must match the Caddy /logs route
      DOZZLE_AUTH_PROVIDER: simple # login page + bcrypt + sessions
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-users.yml:/data/users.yml:ro
    networks: [rumi]

networks:
  rumi:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  backend_keys:
  uploads:
  caddy_data:
  caddy_config:
